<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Watch & Wonder — Splash Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500&display=swap');

  html, body {
    margin: 0;
    height: 100%;
    background: #0d0f14;
    font-family: 'Inter', system-ui, sans-serif;
  }

  .page {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Stand-in for the app behind the splash */
  .app-preview {
    color: #8b93a1;
    text-align: center;
  }
  .app-preview h1 {
    font-family: 'Bebas Neue', sans-serif;
    color: #e8b04b;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }

  .splash {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #0d0f14;
    overflow: hidden;
  }

  .splash-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(420px 420px at 50% 50%, rgba(232, 176, 75, 0.55), transparent 70%);
    opacity: 0;
    pointer-events: none;
  }

  .splash-mark { opacity: 0; transform: scale(0.35); }
  .splash-mark svg { display: block; }

  .splash-wordmark {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.5em;
    color: #f2ede4;
    opacity: 0;
    transform: translateY(6px);
    text-indent: 0.5em;
  }
  .splash-amp { color: #e8b04b; }

  .splash--enter .splash-mark { animation: splash-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .splash--enter .splash-flash { animation: splash-flash 0.7s ease-out forwards; }

  @keyframes splash-pop {
    0% { opacity: 0; transform: scale(0.35); }
    60% { opacity: 1; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes splash-flash {
    0%, 40% { opacity: 0; }
    55% { opacity: 1; }
    100% { opacity: 0; }
  }

  .splash--hold .splash-mark, .splash--exit .splash-mark { opacity: 1; transform: scale(1); }
  .splash--hold .splash-wordmark { animation: splash-wordmark-in 0.9s ease forwards; }
  .splash--exit .splash-wordmark { opacity: 1; transform: translateY(0); letter-spacing: 0.22em; }

  @keyframes splash-wordmark-in {
    0% { opacity: 0; letter-spacing: 0.5em; transform: translateY(6px); }
    100% { opacity: 1; letter-spacing: 0.22em; transform: translateY(0); }
  }

  .splash--exit { opacity: 0; transform: scale(1.04); transition: opacity 0.55s ease, transform 0.55s ease; }
  .splash--gone { display: none; }

  .replay {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2100;
    padding: 10px 18px;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    color: #1a1400;
    background: linear-gradient(180deg, #f2c467, #e8b04b 60%, #c99138);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="app-preview">
      <h1>WATCH &amp; WONDER</h1>
      <p>(this is what sits behind the splash — your actual app renders here)</p>
    </div>
  </div>

  <div class="splash splash--enter" id="splash">
    <div class="splash-flash"></div>
    <div class="splash-mark">
      <svg height="120" viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Watch & Wonder">
        <rect x="62" y="42" width="136" height="136" rx="26" fill="#e8b04b" stroke="#0d0f14" stroke-width="3"/>
        <path d="M108 78 L152 110 L108 142 Z" fill="#0d0f14"/>
        <path d="M158 62 L164 76 L178 82 L164 88 L158 102 L152 88 L138 82 L152 76 Z" fill="#0d0f14"/>
      </svg>
    </div>
    <div class="splash-wordmark">
      <span>WATCH</span><span class="splash-amp">&amp;</span><span>WONDER</span>
    </div>
  </div>

  <button class="replay" onclick="playSplash()">Replay splash</button>

  <script>
    function playSplash() {
      const el = document.getElementById('splash');
      el.classList.remove('splash--gone');
      el.classList.remove('splash--exit');
      el.classList.remove('splash--hold');
      // force reflow so the animation restarts
      void el.offsetWidth;
      el.classList.add('splash--enter');

      setTimeout(() => {
        el.classList.remove('splash--enter');
        el.classList.add('splash--hold');
      }, 700);
      setTimeout(() => {
        el.classList.remove('splash--hold');
        el.classList.add('splash--exit');
      }, 1900);
      setTimeout(() => {
        el.classList.add('splash--gone');
      }, 2500);
    }

    playSplash();
  </script>
</body>
</html>
